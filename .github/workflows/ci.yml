name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:
    inputs:
      legacy_postgres:
        description: Also run retained PostgreSQL compatibility checks
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  local-build-and-test:
    name: Local SQLite build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Domain rules
        run: dotnet tests/RetailCore.Domain.Tests/bin/Release/net10.0/RetailCore.Domain.Tests.dll
      - name: Architecture boundaries
        run: dotnet tests/RetailCore.Architecture.Tests/bin/Release/net10.0/RetailCore.Architecture.Tests.dll
      - name: SQLite integration
        run: dotnet tests/RetailCore.Integration.Tests/bin/Release/net10.0/RetailCore.Integration.Tests.dll
      - name: Setup, catalogue, stock, checkout and migrations
        run: dotnet tests/RetailCore.Foundation.Tests/bin/Release/net10.0/RetailCore.Foundation.Tests.dll
      - name: SQLite model and migrations agree
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/RetailCore.Infrastructure.Sqlite

  windows-desktop:
    name: Windows WPF build and workflow
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: File-backed foundation on Windows
        run: dotnet tests/RetailCore.Foundation.Tests/bin/Release/net10.0/RetailCore.Foundation.Tests.dll
      - name: Real WPF billing, saved bills, approved returns and print recovery
        run: dotnet tests/RetailCore.Desktop.Tests/bin/Release/net10.0-windows/RetailCore.Desktop.Tests.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-previews
          path: tests/RetailCore.Desktop.Tests/bin/Release/net10.0-windows/artifacts/*
          if-no-files-found: warn

  windows-package:
    name: Windows installer and clean-profile smoke
    needs: windows-desktop
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
          $expectedHash = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup download checksum does not match the pinned release.'
          }
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($install.ExitCode)." }
          if (-not (Test-Path (Join-Path $compilerDir 'ISCC.exe'))) { throw 'Inno Setup compiler was not installed.' }
      - name: Build self-contained Windows installer
        id: build_installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Compiler (Join-Path $env:RUNNER_TEMP 'InnoSetup6/ISCC.exe')
      - name: Install, schedule backup and preserve user data on uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build_installer.outcome == 'success' }}
        with:
          name: windows-installer
          path: artifacts/installer/*
          if-no-files-found: error

  legacy-postgres:
    name: Optional legacy PostgreSQL compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RETAILCORE_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet tests/RetailCore.Integration.Tests/bin/Release/net10.0/RetailCore.Integration.Tests.dll
      - name: Retained PostgreSQL model and migrations agree
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/RetailCore.Infrastructure.Postgres
